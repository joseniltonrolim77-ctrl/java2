services:
  api:
    build: .
    environment:
      SERVER_PORT: 3577
      SPRING_PROFILES_ACTIVE: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/devshowcase
    ports:
      - "3577:3577"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: devshowcase,devshowcase_test
    ports:
      - "5432:5432"
    volumes:
      - devshowcase_pgdata:/var/lib/postgresql/data
      - ./scripts/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  devshowcase_pgdata:
